<foreignObject x="-136" y="1370" width="2200" height="59"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;line-height:1.5;color:#0F1E47;text-align:left;word-break:keep-all">¹ AI 증적 판단 (SCR-FO-2216-01): 첨부 증적이 점검 항목별 일반 증적 기준에 맞는지 행마다 판단해 &#x27;AI 검토 의견&#x27; 컬럼에 증적 적합 / 증적 부적합 / 증적 판단불가로 표시. 부적합·판단불가는 &#x27;AI 검토 내역&#x27; 팝오버에 근거 코드 표시 (부적합: Hostname·IP 불일치, 점검 명령어 부적합·실행 오류 / 판단불가: 이미지 판독 불가, 점검 대상 자산 식별 불가, 결과 식별·해석 불가).</div></foreignObject>
<foreignObject x="-136" y="1431" width="2200" height="59"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;line-height:1.5;color:#0F1E47;text-align:left;word-break:keep-all">² 최종 검토(내부 검토선만, 외부 결재 없음): 기안자 → ICT 담당자 → 보안 점검자 순으로 검토. 최종 검토 건(SCR-FO-2311-05)은 자산별로 MPASS 항목 증적의 AI 검토 결과를 집계(증적 적합 n / 부적합 n / 판단불가 n)해 보여주고, [판정하기](SCR-FO-2311-06)에서 항목별 AI 검토 의견을 보며 판정 대기 항목을 PASS/FAIL 판정. AI 판단은 판정 참고용이며 판정은 사람이 함.</div></foreignObject>
<foreignObject x="-136" y="1492" width="2200" height="33"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;line-height:1.5;color:#0F1E47;text-align:left;word-break:keep-all">³ 미정: AI 검토 실행 시점(증적 첨부 시 자동 / 예외·유예처럼 [AI 검토] 버튼), 부적합·판단불가 항목이 있을 때 [점검 완료]를 막을지 안내만 할지. As-Is 반려 루프는 현행 내부 검토선에서 반려가 가능하다는 가정(확인 필요).</div></foreignObject></svg>
