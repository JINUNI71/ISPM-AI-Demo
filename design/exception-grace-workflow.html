<text x="364.0" y="65.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">예외/유예 신청</tspan></text>
<text x="1124.0" y="42.6" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="700">C. 신청</tspan></text>
<text x="1124.0" y="65.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">신청 → 한 문서로 상신</tspan></text>
<text x="2050.0" y="42.6" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="700">D. 심사·결재</tspan></text>
<text x="2050.0" y="65.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">검토 → 결재 → 최종 처리</tspan></text>
<text x="-24.0" y="511.6" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="700">A. 준비</tspan></text>
<text x="-24.0" y="534.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">예외/유예 자산/취약점 항목 식별</tspan></text>
<text x="364.0" y="511.6" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="700">B. 입력·AI 검토</tspan></text>
<text x="364.0" y="534.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">사유·증적 입력 → AI 검토</tspan></text>
<text x="1124.0" y="511.6" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="700">C. 신청</tspan></text>
<text x="1124.0" y="534.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">행 선택 → 신청 확인 → 결재 경로 판단</tspan></text>
<text x="2050.0" y="511.6" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="700">D. 심사·결재</tspan></text>
<text x="2050.0" y="534.8" text-anchor="middle" font-size="16" fill="#0F1E47"><tspan font-weight="400">검토·전결 → 결재 → 최종 처리</tspan></text>
<text x="-136" y="1078.6" font-size="16" fill="#0F1E47"><tspan font-weight="400">¹ 일반 결재로 전환: 내부검토자가 재확인 결과 AI 저위험 판정이 맞지 않다고 보면(예: 증적이 적용 조건 미충족) 전결하지 않고 외부 결재선으로 보냄. AI 판정은 전결 경로의 근거일 뿐 승인이 아님.</tspan></text>
<text x="-136" y="1107.8" font-size="16" fill="#0F1E47"><tspan font-weight="400">² 검토 의견 표시: 증적 판단(증적 적합 / 부적합 / 판단불가)과 저위험 사유 조건(조건 충족 / 조건 미충족 / 조건 확인 불가 / 해당 사유 없음)을 행마다 표시. 그룹 필터 탭(전결 / 일반 결재 / 검토 미완료)으로 무엇을 골라 신청할지 확인.</tspan></text>
<text x="-136" y="1137.0" font-size="16" fill="#0F1E47"><tspan font-weight="400">³ 선택 신청: 체크한 행만 문서 1건으로 신청(자동 분리 없음). 모두 전결 대상이면 내부검토자 전결, 일반 건이 섞이면 경고 박스 + [다시 선택] 후 [일반 결재로 신청](모두 일반 결재). 선택 행 중 조건 확인 불가 건이 있으면 확인 팝업에 안내 박스 + [증적 보완하기]. 신청한 행은 목록에서 빠지고 남은 행은 같은 화면에서 이어서 신청.</tspan></text>
<text x="-136" y="1166.2" font-size="16" fill="#0F1E47"><tspan font-weight="400">⁴ 전결 조건 = domain-knowledge.html Security Criteria의 전결 조건 세트. AI 검토가 행마다 조건 세트에 부합하는지(적합) 판단하고, 선택 행이 모두 어느 한 조건이라도 충족하면 내부검토자 전결. 현재 적용: LR 예외·유예 저위험 사유(v1.1). 추가 예정(가칭): RA 동일 사유 재승인, SD 단기 유예, SC 표준 대체통제. 조건이 추가되면 이 판단에 그대로</tspan></text>
<text x="-136" y="1189.4" font-size="16" fill="#0F1E47"><tspan font-weight="400">수렴됨.</tspan></text>
